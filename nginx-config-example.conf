# =============================================================================
# Floor Heating Designer v3.0 - Nginx Configuration
# =============================================================================
#
# Instrukcja użycia:
# 1. Skopiuj ten plik na serwer:
#    scp nginx-config-example.conf user@vps:/tmp/
#
# 2. Na serwerze utwórz konfigurację:
#    sudo cp /tmp/nginx-config-example.conf /etc/nginx/sites-available/floor-heating-app
#
# 3. Edytuj server_name (zmień "your-domain.com" na swoją domenę lub IP):
#    sudo nano /etc/nginx/sites-available/floor-heating-app
#
# 4. Aktywuj konfigurację:
#    sudo ln -s /etc/nginx/sites-available/floor-heating-app /etc/nginx/sites-enabled/
#    sudo nginx -t
#    sudo systemctl reload nginx
#
# 5. Dla SSL (opcjonalnie):
#    sudo certbot --nginx -d your-domain.com
#
# =============================================================================

server {
    listen 80;
    listen [::]:80;

    # ZMIEŃ NA SWOJĄ DOMENĘ LUB IP!
    server_name your-domain.com www.your-domain.com;
    # Przykład dla IP:
    # server_name 123.45.67.89;

    # Katalog aplikacji
    root /var/www/floor-heating-app;
    index index.html;

    # Logi
    access_log /var/log/nginx/floor-heating-access.log;
    error_log /var/log/nginx/floor-heating-error.log;

    # Gzip compression (optymalizacja transferu)
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/json
        image/svg+xml;

    # Cache dla static assets (optymalizacja)
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Główna lokalizacja - SPA routing
    # WAŻNE: try_files zapewnia że React Router działa poprawnie
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Ukryj wersję Nginx (security)
    server_tokens off;

    # Max upload size (dla przyszłych funkcji jak import/export)
    client_max_body_size 10M;
}
